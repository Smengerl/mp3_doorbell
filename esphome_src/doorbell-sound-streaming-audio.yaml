# DOORBELL WITH I2S SPEAKER + STREAMING MP3 FROM A URL
# Shared HW/system config: doorbell_packages/device_basics.yaml
# Audio: doorbell_packages/i2s_player_streaming_arduino.yaml
#   (I2S speaker, MP3 streamed from a URL - needs the Arduino framework)
substitutions:
  name: doorbell-sound-streaming-audio
  friendly_name: Doorbell (Streaming audio variant)
  comment: Standalone MP3 Doorbell with streaming audio ringtone and HA integration
  project_name: doorbell_sound_streaming_audio.esphome

  TAG: "doorbell-sound-streaming-audio.yaml"

  # Streaming MP3 decode needs the Arduino framework (overrides device_basics' esp-idf default)
  doorbell_framework: arduino

  api_key: !secret doorbell_streaming_api_key
  ota_pw: !secret doorbell_streaming_ota_pw
  fallback_hotspot_ssid: "Doorbell-Sound Streaming Audio Fallback Hotspot"
  fallback_hotspot_pw: !secret doorbell_streaming_fallback_pw

packages:
  debug_basics: !include shared_packages/debug_basics.yaml
  device_basics: !include doorbell_packages/device_basics.yaml
  i2s_player_streaming_arduino: !include doorbell_packages/i2s_player_streaming_arduino.yaml
