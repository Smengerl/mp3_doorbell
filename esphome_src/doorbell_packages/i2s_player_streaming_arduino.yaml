# *******************************************************
# Doorbell audio package: I2S speaker, MP3 STREAMING from a URL (arduino).
# Include together with doorbell_packages/device_basics.yaml.
#
# NOTE: streaming MP3 decode needs the Arduino framework -> this package switches
# device_basics to it via the doorbell_framework substitution.
# *******************************************************
substitutions:
  # Streaming MP3 decode needs the Arduino framework -> switch device_basics over
  doorbell_framework: arduino

  # GPIO Pins
  i2s_lrclk: GPIO26
  i2s_bclk: GPIO27
  i2s_data: GPIO25

i2s_audio:
  i2s_lrclk_pin: $i2s_lrclk
  i2s_bclk_pin: $i2s_bclk

media_player:
  - platform: i2s_audio
    name: "Doorbell Media Player"
    icon: mdi:doorbell
    id: i2s_media_player_id
    dac_type: external
    i2s_dout_pin: $i2s_data
    mode: mono
    on_idle:
      - lambda: 'ESP_LOGI("${TAG}", "Doorbell playback finished!");'
      - script.stop: doorbell_led_watchdog
      - script.execute: doorbell_leds_off
    on_play:
      - lambda: 'ESP_LOGI("${TAG}", "Player play");'
    on_pause:
      - lambda: 'ESP_LOGI("${TAG}", "Player pause");'
    on_announcement:
      - lambda: 'ESP_LOGI("${TAG}", "Player announcement");'

text:
  - platform: template
    id: ringtone_path
    name: "Ringtone URL"
    icon: mdi:download
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "http://homeassistant.local:8123/local/doorbell.mp3"
    on_value:
      - lambda: 'ESP_LOGI("${TAG}", "Ringtone URL changed");'

number:
  # "Volume" 0-100 -> media_player 0.0-1.0. Straight to the player (on_value + on_boot),
  # not per ring.
  - platform: template
    name: "Volume"
    id: var_volume
    icon: "mdi:volume-high"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: ${default_volume}
    on_value:
      then:
        - media_player.volume_set:
            id: i2s_media_player_id
            volume: !lambda "return x / 100.0;"

esphome:
  on_boot:
    priority: -10
    then:
      - media_player.volume_set:
          id: i2s_media_player_id
          volume: !lambda "return id(var_volume).state / 100.0;"

script:
  - id: trigger_doorbell
    mode: restart
    then:
      - if:
          condition:
            - media_player.is_playing:
                id: i2s_media_player_id
          then:
            - lambda: 'ESP_LOGW("${TAG}", "Playback was still active when the doorbell rang. Possible error.");'
            - media_player.stop:
                id: i2s_media_player_id
      - event.trigger:
          id: doorbell_event
          event_type: "ring"
      - light.turn_on:
          id: onboard_led
      - light.turn_on:
          id: doorbell_led_internal
          effect: "${fast_pulse_effect_name}"
      - lambda: |-
          std::string url = id(ringtone_path).state;
          if (url.empty()) {
            ESP_LOGW("${TAG}", "No ringtone URL set");
            return;
          }
          ESP_LOGI("${TAG}", "Doorbell triggered! (Volume: %d; URL: %s)", (int)id(var_volume).state, url.c_str());
          id(i2s_media_player_id).make_call().set_media_url(url).perform();
      # The LEDs are NOT cleaned up here with wait_until - that hung forever on
      # stream / playback errors. Instead it is event-driven via media_player
      # on_idle (-> doorbell_leds_off), with doorbell_led_watchdog as a safety net.
      - script.execute: doorbell_led_watchdog

  # LEDs back to their resting state: onboard off, doorbell LED per the switch state.
  - id: doorbell_leds_off
    then:
      - light.turn_off:
          id: onboard_led
      - if:
          condition:
            lambda: "return id(doorbell_led).state;"
          then:
            - light.turn_on:
                id: doorbell_led_internal
                effect: "None"
          else:
            - light.turn_off:
                id: doorbell_led_internal

  # Safety net: if no on_idle arrives (stream error / missed event) the LEDs go off
  # after 30s anyway.
  - id: doorbell_led_watchdog
    mode: restart
    then:
      - delay: 30s
      - lambda: 'ESP_LOGW("${TAG}", "Doorbell watchdog: no idle report -> LEDs off");'
      - script.execute: doorbell_leds_off
