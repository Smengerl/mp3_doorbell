#-------------------------------------------
# Doorbell shared base (hardware + system config)
# Included by every doorbell-sound*.yaml together with exactly one audio package
# (df_player / i2s_player / i2s_player_streaming_arduino).
# The audio package provides: the player, the "Volume" number (player-specific
# scaling), the trigger_doorbell script and, where applicable, ringtone selection.
#-------------------------------------------

substitutions:
  # esp-idf for df_player/i2s_player; arduino for the streaming variant
  doorbell_framework: esp-idf

  #-------------------------------------------
  # GPIO Pin Configuration
  #-------------------------------------------
  pin_doorbell_switch: GPIO33  # Doorbell button input (active low, to ground)
  pin_doorbell_light: GPIO32   # Doorbell LED output (PWM capable)

  #-------------------------------------------
  # LED Effect Settings
  #-------------------------------------------
  fast_pulse_effect_name: "Fast Pulse"
  fast_pulse_transition: 0.1s  # Time for each brightness transition
  fast_pulse_interval: 0.1s    # Time between brightness changes
  min_brightness: 0%           # Minimum brightness during pulse
  max_brightness: 100%         # Maximum brightness during pulse

  #-------------------------------------------
  # Audio Settings
  #-------------------------------------------
  default_volume: '100'  # Default volume level (0-100)

#-------------------------------------------
# ESP32 Configuration
#-------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  compile_process_limit: 1
  project:
    name: ${project_name}
    version: '1.0'

esp32:
  board: esp32dev
  framework:
    type: ${doorbell_framework}
    version: recommended

#-------------------------------------------
# System Configuration
#-------------------------------------------

# Enable logging for debugging
logger:

# Home Assistant API with encryption
api:
  encryption:
    key: ${api_key}

# Over-The-Air updates
ota:
  platform: esphome
  password: ${ota_pw}

# Allow WiFi provisioning via serial port
improv_serial:

#-------------------------------------------
# WiFi Configuration
#-------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback access point if WiFi fails
  ap:
    ssid: ${fallback_hotspot_ssid}
    password: ${fallback_hotspot_pw}

#-------------------------------------------
# Network Provisioning
#-------------------------------------------

# Captive portal for WiFi credential configuration via AP mode
captive_portal:

# Web UI (also provides the "next url" for improv_serial)
web_server:
  port: 80
  version: 3

#-------------------------------------------
# Control Switches
#-------------------------------------------

# Switch to control the doorbell LED (e.g. disable at night)
switch:
  - platform: template
    name: "Doorbell LED"
    id: doorbell_led
    icon: "mdi:lightbulb"
    # optimistic + restore_mode: without a state source the switch's
    # turn_off_action fires on every boot and id(doorbell_led).state is always
    # false (so the "restore doorbell LED state after ringing" logic never took
    # the on branch).
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - light.turn_on:
          id: doorbell_led_internal
          effect: "None"
    turn_off_action:
      - light.turn_off:
          id: doorbell_led_internal

# The "Volume" number comes from the audio package (player-specific scaling +
# on_value/on_boot hook onto the respective player).

#-------------------------------------------
# Events
#-------------------------------------------

# Doorbell button press event exposed to Home Assistant.
# Home Assistant requires the "doorbell" device class to support the
# "ring" event type - anything else stops working in HA 2027.4.
event:
  - platform: template
    name: Doorbell button
    id: doorbell_event
    device_class: doorbell
    event_types:
      - ring
    on_event:
      then:
        - lambda: |-
            ESP_LOGI("${TAG}", "Doorbell button pressed event %s triggered.", event_type.c_str());

#-------------------------------------------
# Buttons
#-------------------------------------------

# Test button to trigger the doorbell manually
button:
  - platform: template
    name: "Test"
    icon: "mdi:run"
    entity_category: diagnostic
    on_press:
      then:
        - script.execute: trigger_doorbell

#-------------------------------------------
# Lights
#-------------------------------------------

# Onboard status LED for diagnostics
light:
  - platform: status_led
    name: "Onboard Status LED"
    icon: "mdi:led-on"
    id: "onboard_led"
    output: onboard_led_output
    entity_category: diagnostic

  # Doorbell LED with pulsing effect
  - platform: monochromatic
    name: "Doorbell LED"
    id: "doorbell_led_internal"
    output: doorbell_light_output
    effects:
      - pulse:
          name: ${fast_pulse_effect_name}
          transition_length: ${fast_pulse_transition}
          update_interval: ${fast_pulse_interval}
          min_brightness: ${min_brightness}
          max_brightness: ${max_brightness}
    internal: true  # Not exposed to Home Assistant directly

#-------------------------------------------
# Hardware Outputs
#-------------------------------------------
output:
  # Onboard LED on GPIO2
  - id: onboard_led_output
    platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true

  # PWM output for the doorbell LED
  - id: doorbell_light_output
    platform: ledc
    pin: ${pin_doorbell_light}

#-------------------------------------------
# Binary Sensors
# Input sensors exposed to Home Assistant
#-------------------------------------------
binary_sensor:
  # Doorbell button sensor
  - platform: gpio
    name: "Doorbell Button"
    pin:
      number: ${pin_doorbell_switch}
      mode:
        input: true
        pullup: true  # Button connects to ground, need pull-up resistor
      inverted: true  # Invert signal so sensor is high when button is pressed
    filters:
      - delayed_on: 10ms  # Debounce to prevent false triggers
    on_press:
      - script.execute: trigger_doorbell
