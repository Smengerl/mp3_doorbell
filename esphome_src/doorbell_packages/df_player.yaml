    initial_option: ${default_sound}
    icon: mdi:music
    optimistic: true
    restore_value: true # Remember the selected ringtone across reboots
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("${TAG}", "Doorbell ringtone changed! (Ringtone %03d.mp3: %s)", i, x.c_str());

#-------------------------------------------
# Volume
# Sent straight to the DFPlayer (on_value + on_boot), NOT per ring anymore.
# Saves one UART command in the ring path plus the former blocking 150ms pause
# between set_volume and play_file.
#-------------------------------------------
number:
  - platform: template
    name: "Volume"
    id: var_volume
    icon: "mdi:volume-high"
    optimistic: true
    restore_value: true # Remember the volume across reboots
    min_value: 0
    max_value: 100
    step: 1
    initial_value: ${default_volume}
    on_value:
      then:
        - dfplayer.set_volume: !lambda "return (int)(x * 30 / 100);"

esphome:
  on_boot:
    # Set the DFPlayer's initial volume. on_value fires on boot too (restore_value),
    # but the DFPlayer is often not ready right after power-on (~1.5-3s), so do it
    # again with a delay here.
    priority: -10
    then:
      - delay: 3s
      - dfplayer.set_volume: !lambda "return (int)(id(var_volume).state) * 30 / 100;"

#-------------------------------------------
# Built in doorbell functionality
#-------------------------------------------
script:
  - id: trigger_doorbell
    mode: restart
    then:
      - lambda: |-
          // Restart the watchdog (mode: restart -> one execute() is enough)
          id(df_player_watchdog).execute();

          if (id(df_player).is_playing()) {
            ESP_LOGW("${TAG}", "Playback was still active when the doorbell rang. Possible error.");
          }

          id(doorbell_event).trigger("ring");

          // Volume is set via var_volume (on_value / on_boot), NOT here.
          // -> only ONE UART command (play_file), no command gap / blocking delay needed.
          auto ringtone_string = id(ringtone_select).state.c_str();
          auto ringtone_index = id(ringtone_select).active_index();
          int ringtone;
          if (ringtone_index.has_value()) {
            ringtone = ringtone_index.value() + 1;
            ESP_LOGI("${TAG}", "Doorbell triggered! (Volume: %d; Ringtone: %03d.mp3: %s)", (int)id(var_volume).state, ringtone, ringtone_string);
          } else {
            ringtone = ${default_sound_index};
            ESP_LOGW("${TAG}", "Cannot determine selected ringtone. Using default.");
          }
          id(df_player).play_file(ringtone);

          // Turn on LED effects
          id(onboard_led).turn_on().perform();
          id(doorbell_led_internal).turn_on().set_effect("${fast_pulse_effect_name}").perform();

  # Watchdog: reset the DFPlayer if something is still playing after 2min (a missed
  # on_finished_playback event due to a UART glitch). mode: restart -> trigger_doorbell
  # simply restarts it via execute().
  - id: df_player_watchdog
    mode: restart
    then:
      - lambda: 'ESP_LOGI("${TAG}", "DF Player watchdog started");'
      - delay: 2min
      - if:
          condition:
            lambda: "return id(df_player).is_playing();"
          then:
            - lambda: |-
                ESP_LOGW("${TAG}", "Watchdog: player stuck after 2min -> reset");
                id(df_player).reset();
          else:
            - lambda: 'ESP_LOGD("${TAG}", "Watchdog: nothing playing anymore, no reset needed");'

# Stop light effect on doorbell, switch off the control LEDs and stop the watchdog when playback has finished
dfplayer:
  id: df_player
  on_finished_playback:
    then:
      - lambda: |-
          id(df_player_watchdog).stop(); // stop watchdog

          ESP_LOGI("${TAG}", "Doorbell playback finished!");
          id(onboard_led).turn_off().perform();
          if (id(doorbell_led).state) { // Restore doorbell LED to configured state
            id(doorbell_led_internal).turn_on().set_effect("None").perform();
          } else {
            id(doorbell_led_internal).turn_off().perform();
          }
          // dfplayer.sleep // Aggressive sleep mode

#-------------------------------------------
# API
# Enable Home Assistant API
# Expose all functions of the DF player for remote access, e.g. in automations
#
# NOTE FOR REVIEWERS: the api.actions below are kept deliberately as a reserve,
# even though no HA automation currently uses them. They cover the full DFPlayer
# control surface (play/folder/loop/volume/pause/stop/reset) so new sounds/tricks
# are possible without reflashing. Do not remove as "dead code" - the cost is only
# a few lines of API schema.
#-------------------------------------------
api:
  actions:
#  - action: dfplayer_next
#    then:
#      - dfplayer.set_device: TF_CARD
#      - dfplayer.play_next:
#  - action: dfplayer_previous
#    then:
#      - dfplayer.set_device: TF_CARD
#      - dfplayer.play_previous:
  - action: dfplayer_play
    variables:
      file: int
    then:
#      - dfplayer.set_device: TF_CARD
      - dfplayer.play: !lambda 'return file;'
  - action: dfplayer_play_loop
    variables:
      file: int
      loop_: bool
    then:
#      - dfplayer.set_device: TF_CARD
      - dfplayer.play:
          file: !lambda 'return file;'
          loop: !lambda 'return loop_;'
  - action: dfplayer_play_folder
    variables:
      folder: int
      file: int
    then:
#      - dfplayer.set_device: TF_CARD
      - dfplayer.play_folder:
          folder: !lambda 'return folder;'
          file: !lambda 'return file;'

  - action: dfplayer_play_loop_folder
    variables:
      folder: int
    then:
#      - dfplayer.set_device: TF_CARD
      - dfplayer.play_folder:
          folder: !lambda 'return folder;'
          loop: true

#  - action: dfplayer_set_device_tf
#    then:
